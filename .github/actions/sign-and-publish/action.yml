name: Sign and publish release asset
description: Checksum, GPG-sign and upload a release asset
inputs:
  file:
    description: Path of the asset to publish
    required: true
  gpg_private_key:
    required: true
  gpg_passphrase:
    required: true
  github_token:
    required: true
runs:
  using: composite
  steps:
    - uses: crazy-max/ghaction-import-gpg@cb9bde2e2525e640591a934b1fd28eef1dcaf5e5 # v6.2.0
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}
        passphrase: ${{ inputs.gpg_passphrase }}

    - name: Checksum and sign
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        GPG_PASSPHRASE: ${{ inputs.gpg_passphrase }}
      run: |
        cd "$(dirname "$FILE")"
        F="$(basename "$FILE")"
        sha256sum "$F" > "$F.sha256"
        for f in "$F" "$F.sha256"; do
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --detach-sign "$f"
        done

    - uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ inputs.github_token }}
        file: ${{ inputs.file }}*
        file_glob: true
        release_name: ${{ github.ref_name }}
        tag: ${{ github.ref_name }}
        overwrite: true
