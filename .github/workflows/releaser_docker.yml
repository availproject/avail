name: Releaser Docker
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the image for
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # build avail image and publish to dockerhub
  docker_linux_amd64:
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use tag source with current Dockerfile
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          git checkout "$GITHUB_SHA" -- Dockerfile .dockerignore

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: availj/avail:${{ env.TAG }}
