name: Releaser Docker
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the image for
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # build avail image and publish to dockerhub
  docker_linux_amd64:
    runs-on: ${{ vars.BUILD_RUNNER || 'sp1-builder' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use tag source with current Dockerfile
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout --detach "$TAG"
          git checkout "$GITHUB_SHA" -- Dockerfile .dockerignore

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: availj/avail:${{ env.TAG }}
