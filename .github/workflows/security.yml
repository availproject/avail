name: Security CI
on: workflow_dispatch # Workflow is available only on manual dispatch

jobs:
  check:
    name: "Check"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rs/toolchain@v1"
        with:
          override: true
          profile: "minimal"
          toolchain: "stable"
      - uses: "actions-rs/cargo@v1"
        with:
          command: "check"

  fmt:
    name: "Rustfmt"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rs/toolchain@v1"
        with:
          override: true
          profile: "minimal"
          toolchain: "nightly"
      - run: "rustup component add rustfmt"
      - uses: "actions-rs/cargo@v1"
        with:
          command: "fmt"
          args: "--all -- --check"

  clippy:
    name: "Clippy"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions-rs/toolchain@v1"
        with:
          override: true
          profile: "minimal"
          toolchain: "nightly"
      - run: "rustup component add clippy"
      - uses: "actions-rs/cargo@v1"
        with:
          command: "clippy"
          args: "-- -D warnings"

  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rs/audit-check@35b7b53b1e25b55642157ac01b4adceb5b9ebef3 # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
